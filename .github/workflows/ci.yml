# Continuous integration (CI) for each pull request.
# Do not use the `pull_request_target` trigger to run code from a fork.
# Add the job name as a required status check in the branch protection.
name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit hash. Dependabot updates the hash and the comment.
      - name: Review the dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
